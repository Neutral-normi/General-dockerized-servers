networks:
  main_network:
    driver: bridge
services:
  frontend:
    build: ./frontend
#    context: ./frontend/dockerfile
    container_name: frontend
    stdin_open: true
    ports:
      - "3000:3000"
    networks: 
      - main_network
  backend:
    build: ./backend
    container_name: backend
#    context: ./backend/dockerfile
    ports: 
    - "4000:4000"
    networks:
      - main_network
    stdin_open: true
    tty: true
    # depends_on:
    #   db:
    #     condition: service_healthy
  db:
    image: postgres:18-alpine
    container_name: postgresql
    restart: always
    shm_size: 128mb
    env_file:
      - .env
    ports:
        - "5432:5432"
    networks:
        - main_network
    # environment:
    #   POSTGRES_PASSWORD: password
    #   POSTGRES_USER: user
    #   POSTGRES_DB: DB
    # env_file:
    #     - ./env/postgresql.env
    healthcheck:
      test: ["CMD","pg_isready","-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5